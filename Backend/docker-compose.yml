# Local / staging: backend + PostgreSQL
# Usage (from Backend/):
#   docker compose up --build
#
# Frontend: set REACT_APP_API_URL=http://127.0.0.1:8000 (or use CRA proxy to same host).
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartreview_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - chainproof_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartreview_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: smartreview_backend.settings_prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-docker-compose-env}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/smartreview_db
      DATABASE_SSL_REQUIRE: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SECURE_SSL_REDIRECT: "false"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  chainproof_pgdata:
